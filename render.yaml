# ============================================================================
# Configuration Render de Hooked Lab (Blueprint).
#
# Ce fichier decrit le service de production : machine, region, disque,
# commandes, variables. Il vit dans le depot, a cote du code : la
# configuration est versionnee, relisible, et se reconstruit a l'identique.
#
# Les secrets n'y figurent JAMAIS. "sync: false" demande a Render de te
# poser la question a la creation ; "generateValue" le laisse tirer une
# valeur aleatoire que personne n'a jamais vue.
# ============================================================================

services:
  - type: web
    name: hooked-lab
    runtime: node
    # Francfort : la region Render la plus proche de l'Algerie et de l'Europe.
    region: frankfurt
    # Standard = 2 Go de memoire. Suffisant tant que la transcription est
    # confiee a Groq ; Whisper en local exigerait la machine au-dessus.
    plan: standard

    # Le site en ligne suit la branche "main", et elle seule.
    branch: main

    # --omit=optional : n'installe pas Whisper local (plusieurs centaines de
    # Mo inutiles en production). "setup" telecharge yt-dlp pour Linux.
    buildCommand: npm ci --omit=optional && npm run setup && npm run build
    startCommand: npm start
    healthCheckPath: /api/sante

    # Rien ne se met a jour sans ton clic : un envoi sur GitHub ne touche pas
    # au site en ligne tant que tu n'as pas clique sur "Manual Deploy".
    autoDeploy: false

    # A la mise a jour, le serveur recoit un signal d'arret : il refuse alors
    # les nouvelles analyses et laisse finir celles en cours, jusqu'a 5
    # minutes, avant de s'eteindre (voir src/lib/demarrage.ts).
    maxShutdownDelaySeconds: 300

    # Le disque de l'application est efface a chaque mise a jour. Comptes,
    # codes, commandes et analyses vivent donc sur ce disque persistant.
    disk:
      name: donnees
      mountPath: /var/data
      sizeGB: 20

    envVars:
      # --- Reglages, sans secret ------------------------------------------
      - key: DATA_DIR
        value: /var/data
      - key: TRANSCRIBER
        value: groq
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: MAX_ANALYSES_SIMULTANEES
        value: "2"
      - key: USD_TO_DZD_OFFICIAL
        value: "132"
      - key: USD_TO_DZD_PARALLEL
        value: "252"
      # L'application gere elle-meme l'arret propre (fin des analyses).
      - key: NEXT_MANUAL_SIG_HANDLE
        value: "true"

      # --- Secrets tires au hasard par Render --------------------------------
      - key: ADMIN_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

      # --- A saisir toi-meme dans Render, jamais dans un message --------------
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_MOT_DE_PASSE
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP
        sync: false
      - key: NEXT_PUBLIC_META_PIXEL_ID
        sync: false
      - key: NEXT_PUBLIC_TIKTOK_PIXEL_ID
        sync: false

      # --- Paiement par carte (Stripe) : facultatif ---------------------------
      # Cle secrete (sk_live_...) et secret du webhook (whsec_...), puis
      # NEXT_PUBLIC_PAIEMENT_CARTE=1 pour que le site annonce la carte.
      # Laisser vide tant que Stripe n'est pas pret : le site reste en dinars.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_PAIEMENT_CARTE
        sync: false
      # Ton nom de domaine une fois branche (https://www.exemple.com).
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
