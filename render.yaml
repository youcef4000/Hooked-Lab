# ============================================================================
# Configuration Render de Hooked Lab (Blueprint).
#
# Ce fichier decrit le service de production : machine, region, disque,
# commandes, variables. Il vit dans le depot, a cote du code : la
# configuration est versionnee, relisible, et se reconstruit a l'identique.
#
# Les secrets n'y figurent JAMAIS. "sync: false" demande a Render de te
# poser la question a la creation ; "generateValue" le laisse tirer une
# valeur aleatoire que personne n'a jamais vue.
# ============================================================================

services:
  - type: web
    name: hooked-lab
    runtime: node
    # Francfort : la region Render la plus proche de l'Algerie.
    region: frankfurt
    # Standard = 2 Go de memoire. Suffisant tant que la transcription est
    # confiee a Groq ; Whisper en local exigerait la machine au-dessus.
    plan: standard

    # --omit=optional : n'installe pas Whisper local (plusieurs centaines de
    # Mo inutiles en production). "setup" telecharge yt-dlp pour Linux.
    buildCommand: npm ci --omit=optional && npm run setup && npm run build
    startCommand: npm start
    healthCheckPath: /api/sante

    # Mise en ligne manuelle : tant que les analyses tournent dans le meme
    # processus que le site, une mise a jour interrompt celles en cours. On
    # deploie donc a une heure creuse, en cliquant, plutot qu'a chaque envoi
    # sur GitHub. A repasser sur "true" apres la phase 2 (file d'attente).
    autoDeploy: false

    # Le disque de l'application est efface a chaque mise a jour. Comptes,
    # codes, commandes et analyses vivent donc sur ce disque persistant.
    disk:
      name: donnees
      mountPath: /var/data
      sizeGB: 20

    envVars:
      # --- Reglages, sans secret ------------------------------------------
      - key: DATA_DIR
        value: /var/data
      - key: TRANSCRIBER
        value: groq
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: MAX_ANALYSES_SIMULTANEES
        value: "2"
      - key: USD_TO_DZD_OFFICIAL
        value: "132"
      - key: USD_TO_DZD_PARALLEL
        value: "252"

      # --- Secrets tires au hasard par Render --------------------------------
      - key: ADMIN_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

      # --- A saisir toi-meme dans Render, jamais dans un message --------------
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_MOT_DE_PASSE
        sync: false
      - key: NEXT_PUBLIC_WHATSAPP
        sync: false
      - key: NEXT_PUBLIC_META_PIXEL_ID
        sync: false
      - key: NEXT_PUBLIC_TIKTOK_PIXEL_ID
        sync: false
